<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantin Idaman Sekolah</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#fff200,#ffd000,#ffb300);min-height:100vh}

header{
  background:#ffcc00;
  padding:20px;
  text-align:center;
  font-size:30px;
  font-weight:bold;
}

nav{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:10px;
}

nav button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:white;
  cursor:pointer;
  font-weight:bold;
}

.page{display:none;padding:20px}
.active{display:block}

.menu-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:15px;
}

.harga{font-weight:bold;margin:5px 0}

.tersedia{color:green}
.habis{color:red}

input,select,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
}

button{background:#ffd000;border:none;font-weight:bold;cursor:pointer}
button:hover{background:#ffb300}

.keranjang{
  background:white;
  padding:20px;
  border-radius:15px;
  max-width:700px;
  margin:auto;
}

li{
  background:#fff6b0;
  margin:5px 0;
  padding:8px;
  border-radius:8px;
}

.total{font-size:20px;font-weight:bold;margin-top:10px}

.hasil{margin-top:15px;font-weight:bold}

.info{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
}
</style>
</head>

<body>

<header>🍔 KANTIN IDAMAN SEKOLAH 🍟</header>

<nav>
<button onclick="bukaHalaman('menu')">Menu</button>
<button onclick="bukaHalaman('keranjang')">Keranjang</button>
<button onclick="bukaHalaman('antrian')">Antrian</button>
<button onclick="bukaHalaman('tentang')">Tentang</button>
</nav>

<!-- MENU -->
<div id="menu" class="page active">
<div class="menu-container">

<div class="card">
<h3>Nasi Goreng</h3>
<div class="harga">Rp15.000</div>
<div class="tersedia">Tersedia</div>
<input type="number" id="nasi">
<button onclick="tambahMenu('Nasi Goreng',15000,'nasi',true)">Tambah</button>
</div>

<div class="card">
<h3>Burger</h3>
<div class="harga">Rp22.000</div>
<div class="habis">Habis</div>
<input type="number" id="burger">
<button onclick="tambahMenu('Burger',22000,'burger',false)">Tambah</button>
</div>

<div class="card">
<h3>Mie Goreng</h3>
<div class="harga">Rp12.000</div>
<div class="tersedia">Tersedia</div>
<input type="number" id="mie">
<button onclick="tambahMenu('Mie Goreng',12000,'mie',true)">Tambah</button>
</div>

</div>
</div>

<!-- KERANJANG -->
<div id="keranjang" class="page">

<div class="keranjang">
<h2>Keranjang</h2>

<ul id="listPesanan"></ul>

<div class="total">
Total: Rp <span id="total">0</span>
</div>

<h3>Pembayaran</h3>
<select id="metode">
<option>Cash</option>
<option>Debit</option>
<option>QRIS</option>
</select>

<input type="number" id="uang" placeholder="Uang / saldo">

<button onclick="bayar()">Bayar</button>

<div class="hasil" id="hasil"></div>

</div>
</div>

<!-- ANTRIAN -->
<div id="antrian" class="page">
<div class="info">
<h2>Status Pesanan</h2>
<div id="statusPesanan">Belum ada pesanan</div>
</div>
</div>

<!-- TENTANG -->
<div id="tentang" class="page">
<div class="info">
<h2>Tentang Kantin</h2>
<p>Aplikasi kantin sekolah sederhana.</p>
</div>
</div>

<script>

let total = 0;
let nomorPesanan = Math.floor(Math.random()*900)+100;

function bukaHalaman(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* TAMBAH MENU */
function tambahMenu(nama,harga,idInput,tersedia){

  if(!tersedia){

    document.getElementById("hasil").innerHTML =
    "❌ <b>"+nama+"</b> sedang HABIS!";

    alert("Menu habis!");

    bukaHalaman('menu');
    return;
  }

  let jumlah = parseInt(document.getElementById(idInput).value);

  if(!jumlah || jumlah <= 0){
    alert("Masukkan jumlah!");
    return;
  }

  let subtotal = harga * jumlah;
  total += subtotal;

  let li = document.createElement("li");
  li.innerHTML = `${nama} x ${jumlah} = Rp ${subtotal.toLocaleString('id-ID')}`;

  document.getElementById("listPesanan").appendChild(li);
  document.getElementById("total").innerText = total.toLocaleString('id-ID');

  document.getElementById(idInput).value = "";

  alert("Berhasil ditambahkan!");
}

/* BAYAR */
function bayar(){

  let uang = parseInt(document.getElementById("uang").value);
  let metode = document.getElementById("metode").value;

  if(total <= 0){
    alert("Keranjang kosong!");
    bukaHalaman('menu');
    return;
  }

  if(!uang || uang <= 0){
    alert("Masukkan uang!");
    return;
  }

  if(uang < total){

    document.getElementById("hasil").innerHTML =
    "❌ Uang tidak cukup! Silakan ubah metode atau tambah saldo.";

    alert("Uang tidak cukup!");

    bukaHalaman('keranjang');
    document.getElementById("metode").focus();

    return;
  }

  let kembalian = uang - total;

  document.getElementById("hasil").innerHTML =
  `✔ Pembayaran berhasil<br>Total: Rp ${total}<br>Kembalian: Rp ${kembalian}`;

  document.getElementById("statusPesanan").innerHTML =
  `Pesanan ${nomorPesanan} diproses...`;

  bukaHalaman('antrian');

  setTimeout(()=>{
    document.getElementById("statusPesanan").innerHTML =
    `Pesanan ${nomorPesanan} siap diambil!`;
  },4000);

}

</script>

</body>
</html>
