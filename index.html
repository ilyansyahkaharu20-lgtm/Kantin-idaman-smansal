<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kantin Idaman Sekolah</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:linear-gradient(135deg,#fff200,#ffd000,#ffb300);
  min-height:100vh;
}

/* HEADER */
header{
  background:#ffcc00;
  padding:20px;
  text-align:center;
  font-size:35px;
  font-weight:bold;
  color:#6b4d00;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* NAV */
nav{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  padding:15px;
}

nav button{
  padding:12px 20px;
  border:none;
  border-radius:12px;
  background:white;
  cursor:pointer;
  font-weight:bold;
}

nav button:hover{
  background:#ffe066;
}

/* PAGE */
.page{display:none;padding:20px;}
.active{display:block;}

/* MENU */
.menu-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.card h2{color:#ff9900;margin-bottom:10px;}

.harga{font-size:20px;font-weight:bold;}

.stok{font-weight:bold;margin-bottom:10px;}

.tersedia{color:green;}
.habis{color:red;}

input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:10px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  background:#ffd000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{background:#ffb300;}

/* KERANJANG */
.keranjang{
  background:white;
  padding:25px;
  border-radius:20px;
  max-width:800px;
  margin:auto;
}

ul{list-style:none;margin-top:20px;}

li{
  background:#fff6b0;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

.total{margin-top:20px;font-size:25px;font-weight:bold;}

.bayar{background:#00c853;color:white;}
.bayar:hover{background:#00a844;}

.hasil{
  margin-top:20px;
  font-size:18px;
  font-weight:bold;
  line-height:1.6;
}

/* INFO */
.info{
  background:white;
  padding:30px;
  border-radius:20px;
  max-width:800px;
  margin:auto;
  text-align:center;
}

</style>
</head>

<body>

<header>🍔 KANTIN IDAMAN SEKOLAH 🍟</header>

<nav>
<button onclick="bukaHalaman('menu')">🍱 Menu</button>
<button onclick="bukaHalaman('keranjang')">🛒 Keranjang</button>
<button onclick="bukaHalaman('antrian')">📢 Antrian</button>
<button onclick="bukaHalaman('tentang')">🏫 Tentang</button>
</nav>

<!-- MENU -->
<div id="menu" class="page active">
<div class="menu-container">

<div class="card">
<h2>🍚 Nasi Goreng</h2>
<div class="harga">Rp15.000</div>
<div class="stok tersedia">Tersedia</div>
<input type="number" id="nasi">
<button onclick="tambahMenu('Nasi Goreng',15000,'nasi',true)">Tambah</button>
</div>

<div class="card">
<h2>🍔 Burger</h2>
<div class="harga">Rp22.000</div>
<div class="stok habis">Stok Habis</div>
<input type="number" id="burger">
<button onclick="tambahMenu('Burger',22000,'burger',false)">Tambah</button>
</div>

<div class="card">
<h2>🍜 Mie Goreng</h2>
<div class="harga">Rp12.000</div>
<div class="stok tersedia">Tersedia</div>
<input type="number" id="mie">
<button onclick="tambahMenu('Mie Goreng',12000,'mie',true)">Tambah</button>
</div>

</div>
</div>

<!-- KERANJANG -->
<div id="keranjang" class="page">

<div class="keranjang">
<h2>🛒 Keranjang</h2>

<ul id="listPesanan"></ul>

<div class="total">
Total : Rp <span id="total">0</span>
</div>

<h3>💳 Metode Pembayaran</h3>
<select id="metode">
<option>Cash</option>
<option>Debit</option>
<option>QRIS</option>
</select>

<input type="number" id="uang" placeholder="Masukkan uang">

<button class="bayar" onclick="bayar()">Bayar</button>

<div class="hasil" id="hasil"></div>

</div>
</div>

<!-- ANTRIAN -->
<div id="antrian" class="page">
<div class="info">
<h2>📢 Status Pesanan</h2>
<div id="statusPesanan">Belum ada pesanan</div>
</div>
</div>

<!-- TENTANG -->
<div id="tentang" class="page">
<div class="info">
<h2>Tentang Kantin</h2>
<p>Aplikasi pemesanan kantin sekolah sederhana.</p>
</div>
</div>

<script>

let total = 0;
let nomorPesanan = Math.floor(Math.random()*900)+100;

function bukaHalaman(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* TAMBAH MENU */
function tambahMenu(nama,harga,idInput,tersedia){

  if(!tersedia){
    document.getElementById("hasil").innerHTML =
    "❌ Menu <b>"+nama+"</b> sedang habis!";
    alert("Menu habis!");
    bukaHalaman('menu');
    return;
  }

  let jumlah = parseInt(document.getElementById(idInput).value);

  if(!jumlah || jumlah <= 0){
    alert("Masukkan jumlah!");
    return;
  }

  let subtotal = harga * jumlah;
  total += subtotal;

  let li = document.createElement("li");
  li.innerHTML = `${nama} x ${jumlah} = Rp ${subtotal.toLocaleString('id-ID')}`;

  document.getElementById("listPesanan").appendChild(li);
  document.getElementById("total").innerText = total;

  document.getElementById(idInput).value = "";

  alert("Berhasil ditambahkan!");
}

/* BAYAR */
function bayar(){

  let uang = parseInt(document.getElementById("uang").value);
  let metode = document.getElementById("metode").value;

  if(total <= 0){
    alert("Keranjang kosong!");
    bukaHalaman('menu');
    return;
  }

  if(!uang || uang <= 0){
    alert("Masukkan uang!");
    return;
  }

  if(uang < total){

    document.getElementById("hasil").innerHTML =
    "❌ Uang tidak cukup! Silakan ubah metode atau tambah saldo.";

    alert("Uang tidak cukup!");

    bukaHalaman('keranjang');
    document.getElementById("metode").focus();

    return;
  }

  let kembalian = uang - total;

  document.getElementById("hasil").innerHTML =
  `✅ Berhasil!<br>
  Total: Rp ${total}<br>
  Kembalian: Rp ${kembalian}<br>
  Metode: ${metode}`;

  document.getElementById("statusPesanan").innerHTML =
  `📢 Nomor ${nomorPesanan} sedang diproses...`;

  bukaHalaman('antrian');

  setTimeout(()=>{
    document.getElementById("statusPesanan").innerHTML =
    `✅ Pesanan ${nomorPesanan} siap diambil!`;
  },4000);

}

</script>

</body>
</html>
