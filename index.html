<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kantin Idaman</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#ffe600,#ffd000,#ffbf00);
      min-height:100vh;
      padding:20px;
    }

    h1{
      text-align:center;
      color:#5c4300;
      margin-bottom:20px;
      font-size:40px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .menu-container{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:white;
      border-radius:20px;
      padding:20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.03);
    }

    .card h2{
      color:#ff9900;
      margin-bottom:10px;
    }

    .harga{
      font-size:20px;
      font-weight:bold;
      color:#444;
      margin-bottom:10px;
    }

    input{
      width:100%;
      padding:10px;
      border-radius:10px;
      border:1px solid #ccc;
      margin-bottom:10px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#ffd000;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#ffb700;
    }

    .keranjang{
      margin-top:30px;
      background:white;
      padding:20px;
      border-radius:20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    .keranjang h2{
      color:#ff9900;
      margin-bottom:15px;
    }

    ul{
      list-style:none;
      margin-bottom:15px;
    }

    li{
      margin-bottom:10px;
      padding:10px;
      background:#fff7c2;
      border-radius:10px;
    }

    .total{
      font-size:25px;
      font-weight:bold;
      color:#333;
      margin-bottom:15px;
    }

    select{
      width:100%;
      padding:10px;
      border-radius:10px;
      margin-bottom:15px;
    }

    .bayar{
      background:#00c853;
      color:white;
    }

    .bayar:hover{
      background:#00a844;
    }

    .hasil{
      margin-top:15px;
      font-size:20px;
      font-weight:bold;
      color:#333;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🍔 Kantin Idaman 🍟</h1>

    <div class="menu-container">

      <div class="card">
        <h2>Nasi Goreng</h2>
        <div class="harga">Rp15.000</div>
        <input type="number" id="nasi" placeholder="Jumlah">
        <button onclick="tambahMenu('Nasi Goreng',15000,'nasi')">Tambah</button>
      </div>

      <div class="card">
        <h2>Mie Goreng</h2>
        <div class="harga">Rp12.000</div>
        <input type="number" id="mie" placeholder="Jumlah">
        <button onclick="tambahMenu('Mie Goreng',12000,'mie')">Tambah</button>
      </div>

      <div class="card">
        <h2>Ayam Geprek</h2>
        <div class="harga">Rp18.000</div>
        <input type="number" id="ayam" placeholder="Jumlah">
        <button onclick="tambahMenu('Ayam Geprek',18000,'ayam')">Tambah</button>
      </div>

      <div class="card">
        <h2>Bakso</h2>
        <div class="harga">Rp14.000</div>
        <input type="number" id="bakso" placeholder="Jumlah">
        <button onclick="tambahMenu('Bakso',14000,'bakso')">Tambah</button>
      </div>

      <div class="card">
        <h2>Sate Ayam</h2>
        <div class="harga">Rp20.000</div>
        <input type="number" id="sate" placeholder="Jumlah">
        <button onclick="tambahMenu('Sate Ayam',20000,'sate')">Tambah</button>
      </div>

      <div class="card">
        <h2>Es Teh</h2>
        <div class="harga">Rp5.000</div>
        <input type="number" id="esteh" placeholder="Jumlah">
        <button onclick="tambahMenu('Es Teh',5000,'esteh')">Tambah</button>
      </div>

      <div class="card">
        <h2>Jus Alpukat</h2>
        <div class="harga">Rp10.000</div>
        <input type="number" id="jus" placeholder="Jumlah">
        <button onclick="tambahMenu('Jus Alpukat',10000,'jus')">Tambah</button>
      </div>

      <div class="card">
        <h2>Burger</h2>
        <div class="harga">Rp22.000</div>
        <input type="number" id="burger" placeholder="Jumlah">
        <button onclick="tambahMenu('Burger',22000,'burger')">Tambah</button>
      </div>

    </div>

    <div class="keranjang">
      <h2>🛒 Keranjang Pesanan</h2>

      <ul id="listPesanan"></ul>

      <div class="total">
        Total: Rp <span id="total">0</span>
      </div>

      <select id="metode">
        <option value="Tunai">Tunai</option>
        <option value="QRIS">QRIS</option>
        <option value="Debit">Debit</option>
      </select>

      <input type="number" id="uang" placeholder="Masukkan uang / saldo">

      <button class="bayar" onclick="bayar()">Bayar Sekarang</button>

      <div class="hasil" id="hasil"></div>
    </div>

  </div>

  <script>
    let total = 0;

    function tambahMenu(nama,harga,idInput){

      let jumlah = parseInt(document.getElementById(idInput).value);

      if(!jumlah || jumlah <= 0){
        alert("Masukkan jumlah yang benar!");
        return;
      }

      let subtotal = harga * jumlah;

      total += subtotal;

      let list = document.getElementById("listPesanan");

      let item = document.createElement("li");

      item.innerHTML = `
        ${nama} x ${jumlah} = Rp ${subtotal.toLocaleString('id-ID')}
      `;

      list.appendChild(item);

      document.getElementById("total").innerText =
      total.toLocaleString('id-ID');

      document.getElementById(idInput).value = "";
    }

    function bayar(){

      let uang = parseInt(document.getElementById("uang").value);

      let metode = document.getElementById("metode").value;

      if(!uang || uang <= 0){
        alert("Masukkan uang/saldo!");
        return;
      }

      if(uang < total){
        document.getElementById("hasil").innerHTML =
        "❌ Saldo / uang tidak cukup!";
      }

      else{

        let kembalian = uang - total;

        document.getElementById("hasil").innerHTML =
        `
        ✅ Pembayaran berhasil dengan ${metode}<br>
        💰 Kembalian: Rp ${kembalian.toLocaleString('id-ID')}<br>
        🍽️ Pesanan sedang disiapkan...
        `;
      }
    }
  </script>

</body>
                           </html>
